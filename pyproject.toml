[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wng-soap-note-generator"
version = "0.1.0"
description = "WellNest SOAP Note Generator - AI-powered healthcare documentation tool"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40.34",
    "kaleido>=0.2.1",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.54.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "python-dotenv>=1.1.1",
    "reportlab>=4.2.0",
    "streamlit>=1.39.0",
]

[dependency-groups]
dev = []

[tool.ty.rules]
unresolved-import = "warn"
unknown-argument = "warn"